apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  # Explicit so `kyverno apply` on rendered output matches the
  # namespace-scoped policy pack; Argo would otherwise inject it.
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: kubemend-lab
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
