# Kyverno for the lab (ARCHITECTURE.md §5, §6).
#
# Present so that admission behaves the same way the validator does. Single
# replica everywhere: the lab is one node, and the HA defaults would schedule
# three of each controller against anti-affinity rules that cannot be satisfied.

admissionController:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}

backgroundController:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 192Mi}

# Neither is needed to enforce or to run `kyverno apply` in the validator.
cleanupController:
  enabled: false

reportsController:
  enabled: false
