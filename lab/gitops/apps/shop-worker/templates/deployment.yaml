apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  # Explicit so `kyverno apply` on rendered output matches the
  # namespace-scoped policy pack; Argo would otherwise inject it.
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: kubemend-lab
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Allocate the configured amount into a memory-backed emptyDir and hold
          # it, then log a heartbeat.
          #
          # The ballast deliberately does NOT go to /dev/shm: the runtime caps
          # that at 64Mi regardless of the container's memory limit, so a large
          # allocation there fails with "No space left on device" instead of
          # being OOM-killed. A `medium: Memory` emptyDir counts against the
          # container's limit, which is what makes the OOM reproducible.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "shop-worker starting, allocating {{ .Values.workload.allocateMb }}Mi"
              dd if=/dev/zero of=/ballast/block bs=1M count={{ .Values.workload.allocateMb }} 2>/dev/null
              echo "allocation complete"
              # busybox ships httpd; serving a real port means shop-api's
              # UPSTREAM_URL resolves to something that answers, so a connection
              # error in the logs is a fault the scenario injected rather than
              # a permanently broken lab.
              mkdir -p /tmp/www && echo "ok" > /tmp/www/index.html
              httpd -f -p {{ .Values.service.port }} -h /tmp/www &
              echo "listening on {{ .Values.service.port }}, entering heartbeat loop"
              while true; do
                echo "worker heartbeat, queue depth 0"
                sleep {{ .Values.workload.heartbeatSeconds }}
              done
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: ballast
              mountPath: /ballast
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: ballast
          emptyDir:
            medium: Memory
