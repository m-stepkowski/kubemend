apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  # Explicit so `kyverno apply` on rendered output matches the
  # namespace-scoped policy pack; Argo would otherwise inject it.
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  # Explicit so `kyverno apply` on rendered output matches the
  # namespace-scoped policy pack; Argo would otherwise inject it.
  namespace: {{ .Release.Namespace }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
