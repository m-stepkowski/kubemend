# Kubemend default configuration (ARCHITECTURE.md §8).
# Every value is overridable by environment variable via pydantic-settings.

model:
  main:
    provider: anthropic # anthropic | openai | bedrock
    name: claude-sonnet-5
    max_cost_usd_per_run: 1.00
  cheap:
    provider: anthropic
    name: claude-haiku-4-5
  pricing_table: config/pricing.yaml
  # Per-tier provider examples (not the default — main/cheap above is what a
  # fresh checkout actually runs):
  #
  # DeepSeek (or any OpenAI-compatible endpoint: vLLM, Ollama, ...) as the
  # cheap tier, Claude on Bedrock as the main tier:
  #   main:
  #     provider: bedrock
  #     name: us.anthropic.claude-sonnet-5-...
  #     aws_region: us-east-1        # omit to use the AWS env/profile chain
  #   cheap:
  #     provider: openai
  #     name: deepseek-v4-flash
  #     base_url: https://api.deepseek.com
  #
  # A fully local endpoint (Ollama, vLLM) with a smaller context window:
  #   cheap:
  #     provider: openai
  #     name: llama-3.1-8b
  #     base_url: http://localhost:11434/v1
  #     window_tokens: 128000        # falls back to context.model_window_tokens if unset
  #
  # Credentials are never set here — ANTHROPIC_API_KEY / OPENAI_API_KEY / the
  # AWS credential chain, same as today.

budgets:
  max_iterations: 15
  max_wall_seconds: 600

context:
  result_token_cap: 6000
  compact_threshold: 0.70
  # The threshold is a fraction of the model window, so the window has to be
  # stated alongside the model that defines it.
  model_window_tokens: 200000

observability:
  provider: prometheus_loki
  # Port-forwarded lab endpoints (task lab:forward)
  prometheus_url: http://localhost:9090
  loki_url: http://localhost:3100

kubernetes:
  # Generated by the lab bootstrap; the agent process never holds cluster-admin.
  kubeconfig: ~/.kube/kubemend-lab-readonly
  context: kind-kubemend

gitops:
  # `local` is the committed default so a fresh checkout runs without a token.
  # The lab demo opts in with KUBEMEND_GITOPS__BACKEND=gitea, which also needs
  # the token `task lab:workspace` generates into .lab/.
  backend: local # local | gitea
  repo_path: .lab/gitops-workspace
  # The single write path. Anything outside these globs is refused by the
  # proposer before a file is touched.
  writable_globs:
    - "apps/**/values*.yaml"
  base_branch: main

argocd:
  # The gate's diff stage runs through Argo so the agent process never needs a
  # cluster credential that can write. Token generated by `task lab:argocd-token`.
  server: localhost:8080
  plaintext: true
  token_file: .lab/argocd-token
