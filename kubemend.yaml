# Kubemend default configuration (ARCHITECTURE.md §8).
# Every value is overridable by environment variable via pydantic-settings.

model:
  main:
    provider: anthropic # anthropic | openai | bedrock
    name: claude-sonnet-5
    max_cost_usd_per_run: 1.00
  cheap:
    provider: anthropic
    name: claude-haiku-4-5
  pricing_table: config/pricing.yaml
  # Per-tier provider examples (not the default — main/cheap above is what a
  # fresh checkout actually runs):
  #
  # DeepSeek (or any OpenAI-compatible endpoint: vLLM, Ollama, ...) as the
  # cheap tier, Claude on Bedrock as the main tier:
  #   main:
  #     provider: bedrock
  #     name: us.anthropic.claude-sonnet-5-...
  #     aws_region: us-east-1        # omit to use the AWS env/profile chain
  #   cheap:
  #     provider: openai
  #     name: deepseek-v4-flash
  #     base_url: https://api.deepseek.com
  #
  # A fully local endpoint (Ollama, vLLM) with a smaller context window:
  #   cheap:
  #     provider: openai
  #     name: llama-3.1-8b
  #     base_url: http://localhost:11434/v1
  #     window_tokens: 128000        # falls back to context.model_window_tokens if unset
  #
  # Credentials are never set here — ANTHROPIC_API_KEY / OPENAI_API_KEY / the
  # AWS credential chain, same as today.

budgets:
  max_iterations: 15
  max_wall_seconds: 600

context:
  result_token_cap: 6000
  compact_threshold: 0.70
  # The threshold is a fraction of the model window, so the window has to be
  # stated alongside the model that defines it.
  model_window_tokens: 200000

observability:
  provider: prometheus_loki
  # Port-forwarded lab endpoints (task lab:forward)
  prometheus_url: http://localhost:9090
  loki_url: http://localhost:3100
  # Self-hosted Tempo, only read when enable.traces is true (task lab:tempo
  # installs one into the lab cluster; task lab:forward exposes :3200).
  tempo_url: http://localhost:3200

  # Which pillars the model may query. `provider` says *where* data comes
  # from; this says *whether* to ask at all. A disabled pillar registers no
  # tool, so the model never spends an iteration discovering a backend that
  # isn't there. Traces default off — plenty of clusters run no tracing, and
  # unlike metrics/logs there is no sane endpoint to guess. Enabling a pillar
  # the provider cannot serve fails at startup, naming both halves.
  enable:
    metrics: true
    logs: true
    traces: false

  # Datadog as the observability provider instead (not the default — the lab
  # runs Prometheus/Loki by default; `task lab:datadog-agent` optionally also
  # reports the lab's own cluster data to a real Datadog org, see README):
  #   provider: datadog
  #   datadog_site: datadoghq.eu     # datadoghq.com | datadoghq.eu | ...
  #   datadog_api_key_file: .lab/datadog-api-key
  #   datadog_app_key_file: .lab/datadog-app-key
  #
  # Keys are never set inline — same file-based idiom as gitea_token_file below.

  # Grafana Cloud as the observability provider instead (also not the
  # default; `task lab:grafana-agent` optionally also reports the lab's own
  # cluster data to a real Grafana Cloud account, see README):
  #   provider: grafana_cloud
  #   grafana_cloud_prometheus_url: https://prometheus-prod-NN-prod-xx.grafana.net/api/prom
  #   grafana_cloud_prometheus_instance_id: "123456"
  #   grafana_cloud_loki_url: https://logs-prod-NNN.grafana.net
  #   grafana_cloud_loki_instance_id: "654321"
  #   grafana_cloud_token_file: .lab/grafana-cloud-token
  # Tempo, only needed when enable.traces is true (one Access Policy token
  # covers all three signals, so token_file above is reused):
  #   grafana_cloud_tempo_url: https://tempo-prod-NN-prod-xx.grafana.net
  #   grafana_cloud_tempo_instance_id: "112233"
  #
  # Traces on Datadog need no extra endpoint config — APM span search uses the
  # same api/app keys as metrics and logs; just set enable.traces: true.
  #
  # One shared Access Policy token for both, unlike Datadog's two separate
  # keys — same file-based idiom as datadog_api_key_file above.

kubernetes:
  # Generated by the lab bootstrap; the agent process never holds cluster-admin.
  kubeconfig: ~/.kube/kubemend-lab-readonly
  context: kind-kubemend

gitops:
  # `local` is the committed default so a fresh checkout runs without a token.
  # The lab demo opts in with KUBEMEND_GITOPS__BACKEND=gitea, which also needs
  # the token `task lab:workspace` generates into .lab/.
  backend: local # local | gitea
  repo_path: .lab/gitops-workspace
  # The single write path. Anything outside these globs is refused by the
  # proposer before a file is touched.
  writable_globs:
    - "apps/**/values*.yaml"
  base_branch: main

  # Split mode instead (M11) — each app's chart lives in its own repo, only
  # values live in the repo above (not the default; absent = single-repo
  # mode, byte-for-byte today's behavior):
  #   chart_repos:
  #     checkout_root: /workspace-charts     # <root>/<app>, cloned by the Job's init containers
  #     url_template: "https://git.corp/platform/{app}-chart.git"   # convention route
  #     template_chart_path: "."
  #     apps:                                # explicit entries override the template
  #       shop-api:
  #         url: "https://git.corp/legacy/shop-api.git"
  #         chart_path: "chart"
  #
  # See docs/design/m11-multi-repo-gitops.md.

argocd:
  # The gate's diff stage runs through Argo so the agent process never needs a
  # cluster credential that can write. Token generated by `task lab:argocd-token`.
  server: localhost:8080
  plaintext: true
  token_file: .lab/argocd-token

# The Kyverno policy pack the verification gate scans every proposal against
# (§5). The container image bakes its own copy in and overrides this via
# KUBEMEND_POLICIES_DIR — see Dockerfile.
policies_dir: policies
