# Model pricing in USD per 1M tokens, consumed by kubemend/trace/cost.py.
#
# Cached input is billed separately from fresh input, so it needs its own rate:
# with prompt caching on from day one (ARCHITECTURE.md §2.7) most of a run's
# input tokens are cache reads, and pricing them at the full input rate
# overstates every cost figure in the eval report.
#
# Cache writes cost 1.25x input at the default 5-minute TTL; cache reads cost
# 0.1x input. Verify these numbers against a real invoice once, early — the
# whole cost-guardrail story in IMPLEMENTATION_PLAN.md depends on them.
#
# NOTE: Sonnet 5 carries introductory pricing of $2.00 / $10.00 through
# 2026-08-31. The list price below is therefore a ceiling until then; runs
# during the intro window cost less than the report claims.

models:
  claude-sonnet-5:
    input: 3.00
    output: 15.00
    cache_write_5m: 3.75
    cache_read: 0.30

  claude-haiku-4-5:
    input: 1.00
    output: 5.00
    cache_write_5m: 1.25
    cache_read: 0.10

  # -- M7: non-Anthropic providers ------------------------------------------
  # UNVERIFIED (placeholder, added M7) — check against a real invoice before
  # trusting these for a committed baseline. Sourced from public pricing
  # pages at the time this milestone landed; provider pricing changes
  # without notice, and these entries will not update themselves.
  #
  # `gpt-4.1-mini` below is the exception: verified against real billing in
  # M14, and the check found the placeholder's cache_read was 2x too high.
  # Treat that as the expected outcome for the rest of this block rather
  # than the surprise — none of the others has been checked.

  # DeepSeek's own API is OpenAI-compatible; cache reads are automatic and
  # billed near-free (no separate cache_write charge to model).
  deepseek-v4-flash:
    input: 0.14
    output: 0.28
    cache_read: 0.0028

  deepseek-v4-pro:
    input: 0.435
    output: 0.87
    cache_read: 0.003625

  # OpenAI's flagship at M7 time; a cost-sensitive tier also exists
  # (substantially cheaper) — add its entry here once you know which
  # OPENAI_MODEL string you're actually pointing `cheap` at.
  gpt-5.5:
    input: 5.00
    output: 30.00
    cache_read: 0.50

  # Non-reasoning model — used for the M7 acceptance sweep specifically
  # because gpt-5.6-luna (the reasoning-tier cheap model) rejects tool
  # calls on this endpoint unless reasoning_effort=none is set, which this
  # client does not do automatically (see openai_client.py, decisions.md).
  #
  # VERIFIED against real billing 2026-08-23 (M14). `cache_read` was 0.20
  # here and is wrong: OpenAI bills cached input at 25% of input, not 50%.
  # Checked by totalling every gpt-4.1-mini trace (747,156 fresh input +
  # 2,153,600 cached + 72,367 output = 2,973,123 tokens, 222 API calls)
  # against the account's own usage page for the same project (3,068,152
  # tokens, 256 requests, $0.68 billed):
  #
  #   at cache_read 0.20 -> $0.845 computed, ~$0.87 scaled to the dashboard's
  #                         token count. 28% above what was actually billed.
  #   at cache_read 0.10 -> $0.630 computed, ~$0.65 scaled. Within ~5% of the
  #                         $0.68 billed, the residual being the ~34 requests
  #                         present in the account but not in local traces.
  #
  # This one matters more than its size suggests: cache reads are ~70% of
  # this harness's input tokens, so the old value overstated every cost
  # figure in every eval report by roughly a quarter.
  gpt-4.1-mini:
    input: 0.40
    output: 1.60
    cache_read: 0.10

  # Bedrock model IDs are region/version-stamped strings (e.g.
  # "us.anthropic.claude-sonnet-5-v1:0") — copy the exact ID from your AWS
  # console into `model.*.name`, then key an entry here with that same
  # string. Bedrock's Claude pricing has historically matched Anthropic's
  # direct API rates; not independently re-verified for this table.
  "us.anthropic.claude-sonnet-5-v1:0":
    input: 3.00
    output: 15.00
    cache_write_5m: 3.75
    cache_read: 0.30

  # A fully local model (Ollama, vLLM) has no API cost at all — an explicit
  # all-zero entry is honored by load_pricing (only a *missing* key falls
  # back to FALLBACK_PRICE), which is what you want: real $0, not an
  # inflated guess. This deliberately disables the cost guardrail for that
  # model; max_iterations/max_wall_seconds still bound the run.
  local-model-example:
    input: 0.0
    output: 0.0
    cache_write_5m: 0.0
    cache_read: 0.0
