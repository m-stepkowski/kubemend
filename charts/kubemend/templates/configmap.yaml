apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubemend.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemend.labels" . | nindent 4 }}
data:
  # Merged as dicts, not string-concatenated, so a user override touching
  # the same top-level `kubernetes:` key deep-merges instead of producing a
  # duplicate key that would silently drop in_cluster: true.
  kubemend.yaml: |
    {{- $defaults := dict "kubernetes" (dict "in_cluster" true) }}
    {{- $merged := mergeOverwrite $defaults .Values.config.overrides }}
    {{- toYaml $merged | nindent 4 }}
