{{- if .Values.operator.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubemend.fullname" . }}-operator-webhook-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemend.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "operator.webhookToken is required when operator.enabled=true (e.g. `openssl rand -hex 32`)" .Values.operator.webhookToken | quote }}
{{- end }}
