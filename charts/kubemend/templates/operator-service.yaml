{{- if .Values.operator.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubemend.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubemend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "kubemend.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: operator
  ports:
    - name: http
      port: {{ .Values.operator.port }}
      targetPort: http
{{- end }}
