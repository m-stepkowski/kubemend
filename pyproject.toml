[project]
name = "kubemend"
description = "GitOps-native Kubernetes remediation agent that can only open pull requests"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "kubernetes>=31.0",
    "GitPython>=3.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
kubemend = "kubemend.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "kubemend/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["kubemend"]

# ARCHITECTURE.md §9 keeps prompts/ at the repo root, but an installed wheel
# only ships kubemend/. Ship them inside the package so a released CLI can
# render its own prompts; kubemend/prompts.py prefers this copy and falls back
# to the repo-root one in a development checkout.
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "kubemend/prompts"

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff formats Python code blocks inside Markdown. The design docs use aligned
# inline comments deliberately, so they are prose we review, not code we format.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["kubemend", "evals", "tests"]

[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Flat layout (ARCHITECTURE.md §9 puts kubemend/ at the repo root), so the
# editable install's .pth entry collides with the working directory and site
# skips it. Put the root on the path explicitly: tests then import the working
# tree rather than depending on how the dev install happens to be wired.
pythonpath = ["."]
addopts = "-m 'not lab'"
markers = [
    "lab: integration test requiring the kind lab cluster (task lab:up)",
    "integration: exercises a real external process or network endpoint",
]
