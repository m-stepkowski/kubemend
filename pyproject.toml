[project]
name = "kubemend"
description = "GitOps-native Kubernetes remediation agent that can only open pull requests"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
dependencies = [
    "anthropic[bedrock]>=0.40",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "kubernetes>=31.0",
    "GitPython>=3.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "openai>=3.1.0",
]

[project.scripts]
kubemend = "kubemend.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "kubemend/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["kubemend"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff formats Python code blocks inside Markdown. The design docs use aligned
# inline comments deliberately, so they are prose we review, not code we format.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The validator fixtures reproduce real kubectl and helm output verbatim, long
# lines included. The parsers under test are regexes over those exact lines, so
# rewrapping the fixtures would make them lie about the format.
"tests/unit/test_validator.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["kubemend", "evals", "tests"]

[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the working tree rather than depending on how the dev install happens
# to be wired. That dependency is not hypothetical: on macOS the venv's .pth
# files carry the UF_HIDDEN flag, and CPython 3.11+ skips hidden .pth files, so
# an editable install can be silently inert.
pythonpath = ["."]
addopts = "-m 'not lab and not docker'"
markers = [
    "lab: integration test requiring the kind lab cluster (task lab:up)",
    "integration: exercises a real external process or network endpoint",
    "slow: builds an artefact or otherwise takes seconds rather than milliseconds",
    "docker: builds a real container image (needs a Docker daemon, network access, ~1-2 minutes)",
]
